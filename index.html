
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UP Jan Jankari</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

header {
  background: #14532d;
  color: white;
  padding: 18px 14px;
}

header h2 { margin: 0 0 6px; }
header p { margin: 0; font-size: 14px; }

.search {
  display: flex;
  gap: 7px;
  padding: 12px;
  background: white;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
}

button {
  background: #15803d;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 10px 13px;
  font-size: 14px;
}

#map {
  height: 52vh;
  min-height: 330px;
  width: 100%;
}

#details {
  background: white;
  margin: 12px;
  padding: 16px;
  border-radius: 12px;
  line-height: 1.7;
}

.note {
  color: #64748b;
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 14px;
  font-size: 12px;
  color: #64748b;
}
</style>
</head>

<body>
<header>
  <h2>🗺️ UP जन जानकारी</h2>
  <p>उत्तर प्रदेश की जगहें और सरकारी जानकारी</p>
</header>

<div class="search">
  <input id="place"
   placeholder="गाँव, शहर या जगह खोजें">
  <button onclick="searchPlace()">खोजें</button>
</div>

<div id="map"></div>

<section id="details">
  <h3>📍 गाजीपुर, उत्तर प्रदेश</h3>
  <p>नक्शे पर किसी जगह को चुनो या ऊपर उसका नाम खोजो।</p>
  <p class="note">
    अभी यह शुरुआती वर्जन है। प्रधान, विधायक और
    अधिकारियों के सत्यापित रिकॉर्ड अगले चरण में जोड़ेंगे।
  </p>
</section>

<footer>
  नक्शा © OpenStreetMap contributors
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  
<script>const map = L.map('map').setView([25.58, 83.58], 10);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

let marker;
let requestNumber = 0;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[c]);
}

async function getPlaceInfo(lat, lon, typedName = '') {
  const id = ++requestNumber;
  const details = document.getElementById('details');

  if (marker) map.removeLayer(marker);

  marker = L.marker([lat, lon]).addTo(map);
  marker.bindPopup('जगह की जानकारी खोजी जा रही है...').openPopup();

  details.innerHTML = '<h3>जानकारी खोजी जा रही है...</h3>';

  try {
    const url =
      'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' +
      lat + '&lon=' + lon + '&zoom=18&addressdetails=1';

    const response = await fetch(url);
    if (!response.ok) throw new Error('डेटा नहीं मिला');

    const data = await response.json();
    if (id !== requestNumber) return;

    const a = data.address || {};
    const name = typedName || data.name ||
      a.village || a.town || a.city ||
      a.suburb || 'चुनी गई जगह';

    const district = a.state_district || a.county || 'उपलब्ध नहीं';
    const village = a.village || a.town || a.city ||
      a.hamlet || a.suburb || 'उपलब्ध नहीं';
    const pin = a.postcode || 'उपलब्ध नहीं';

    marker.bindPopup(escapeHTML(name)).openPopup();

    details.innerHTML = `
      <h3>📍 ${escapeHTML(name)}</h3>
      <p><b>जिला:</b> ${escapeHTML(district)}</p>
      <p><b>गाँव/शहर:</b> ${escapeHTML(village)}</p>
      <p><b>पिन कोड:</b> ${escapeHTML(pin)}</p>
      <p><b>अक्षांश:</b> ${lat.toFixed(5)}</p>
      <p><b>देशांतर:</b> ${lon.toFixed(5)}</p>
      <hr>
      <p><b>ग्राम प्रधान:</b> आधिकारिक रिकॉर्ड जोड़ना बाकी</p>
      <p><b>विधायक / सांसद:</b> निर्वाचन क्षेत्र का सत्यापन बाकी</p>
      <p><b>तहसील / ब्लॉक:</b> आधिकारिक डेटा जोड़ना बाकी</p>
      <p class="note">
        जगह का नाम OpenStreetMap से मिला है।
        सरकारी पदाधिकारियों की जानकारी अभी सत्यापित नहीं है।
      </p>
    `;
  } catch (error) {
    if (id !== requestNumber) return;

    details.innerHTML = `
      <h3>📍 चुनी गई जगह</h3>
      <p>अक्षांश: ${lat.toFixed(5)}</p>
      <p>देशांतर: ${lon.toFixed(5)}</p>
      <p>जगह का नाम अभी नहीं मिल सका। इंटरनेट जाँचकर फिर कोशिश करें।</p>
    `;
  }
}

map.on('click', e => {
  getPlaceInfo(e.latlng.lat, e.latlng.lng);
});

async function searchPlace() {
  const input = document.getElementById('place');
  const q = input.value.trim();

  if (!q) {
    alert('गाँव या शहर का नाम लिखें।');
    return;
  }

  const details = document.getElementById('details');
  details.innerHTML = '<h3>जगह खोजी जा रही है...</h3>';

  try {
    const query = q + ', Ghazipur, Uttar Pradesh, India';
    const url =
      'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=' +
      encodeURIComponent(query);

    const response = await fetch(url);
    if (!response.ok) throw new Error('खोज उपलब्ध नहीं');

    const results = await response.json();

    if (!results.length) {
      details.innerHTML =
        '<h3>जगह नहीं मिली</h3><p>नाम बदलकर दोबारा खोजें।</p>';
      return;
    }

    if (results.length > 1) {
      details.innerHTML = '<h3>खोज के परिणाम</h3>' +
        results.map((p, i) =>
          `<p><button onclick="selectResult(${i})">${
            escapeHTML(p.display_name)
          }</button></p>`
        ).join('');
      window.searchResults = results;
      return;
    }

    selectResult(0, results);
  } catch (error) {
    details.innerHTML =
      '<p>खोज नहीं हो पाई। इंटरनेट कनेक्शन जाँचकर फिर कोशिश करें।</p>';
  }
}

function selectResult(index, results = window.searchResults) {
  if (!results || !results[index]) return;

  const p = results[index];
  const lat = Number(p.lat);
  const lon = Number(p.lon);

  map.setView([lat, lon], 15);
  getPlaceInfo(lat, lon, p.name || p.display_name);
}

document.getElementById('place').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchPlace();
});
</script>
 </body>
</html>
